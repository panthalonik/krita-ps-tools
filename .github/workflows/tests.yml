name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          # system libraries for Qt's offscreen platform; usually preinstalled,
          # so a temporary mirror problem must not fail the tests
          (sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 >/dev/null) || echo "apt skipped"
          pip install -q numpy PyQt5
      - name: Python plugin tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd plugin
          for t in verification/test_*.py; do echo "== $t"; python "$t"; done
      - name: Screenshots (base64 in the log)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd plugin && python verification/screens.py
      - name: Plugin zip accepted by Krita's importer
        run: |
          python ci/make_plugin_zip.py /tmp/ps_tools_plugin.zip
          curl -sSfL -o /tmp/plugin_importer.py https://raw.githubusercontent.com/KDE/krita/bd6e8d061d2f0388c5b10278786cf0fe62e3135f/plugins/python/plugin_importer/plugin_importer.py
          python ci/check_plugin_zip.py /tmp/plugin_importer.py /tmp/ps_tools_plugin.zip
      - name: C++ kernel tests
        run: |
          python krita/plugins/filters/psfilters/tests/gen_reference.py plugin/ps_tools /tmp/vectors
          g++ -O2 -std=c++17 -Wall -Wextra -o /tmp/test_kernels krita/plugins/filters/psfilters/tests/test_kernels.cpp
          /tmp/test_kernels /tmp/vectors
      - name: Camera Raw kernel tests (tiles, directions, NaN)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -o /tmp/cameraraw_cli krita/plugins/filters/psfilters/tests/cameraraw_cli.cpp
          python krita/plugins/filters/psfilters/tests/test_cameraraw.py /tmp/cameraraw_cli
