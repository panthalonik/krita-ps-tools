name: Build Krita PS for Windows

on:
  push:
    branches: [main]
    paths:
      - 'krita/**'
      - 'ci/**'
      - 'plugin/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      gmic:
        description: 'Also build the G''MIC plugin (slower)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

env:
  KB: C:\kb
  KRITA_SHA: bd6e8d061d2f0388c5b10278786cf0fe62e3135f   # Krita 5.3.4.1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        shell: pwsh
        run: Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: C:\kb\cache
          key: deps-${{ github.run_id }}
          restore-keys: deps-

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: C:\kb\ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        id: build
        shell: pwsh
        timeout-minutes: 320
        env:
          KRITACI_SKIP_BUILD_3RDPARTY_PLUGINS: ${{ inputs.gmic && 'False' || 'True' }}
        run: ci\build_windows.ps1

      # saved even when the build failed or timed out: the next run continues from here
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\kb\ccache
          key: ccache-${{ github.run_id }}

      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\kb\cache
          key: deps-${{ github.run_id }}

      - name: Plugin zip (import in Krita with Tools > Scripts > Import Python Plugin from File)
        shell: pwsh
        run: |
          python ci\make_plugin_zip.py C:\kb\out\ps_tools_plugin.zip
          python ci\check_plugin_zip.py C:\kb\krita\plugins\python\plugin_importer\plugin_importer.py C:\kb\out\ps_tools_plugin.zip

      # Blend If, clipping and adjustment layers: rendered pixels and the
      # exported PSD (the files are attached to the run as "smoke-test")
      - name: Smoke test (renders + PSD export)
        id: smoke
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: ci\smoke_test.ps1

      - name: Upload smoke test files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: C:\kb\out\smoke
          if-no-files-found: ignore

      # the package also stays on the run's page: downloadable even when
      # publishing the release fails (e.g. the token may not create releases)
      - name: Upload package
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Krita-PS-build${{ github.run_number }}
          path: |
            C:\kb\out\krita-x64-*.zip
            !C:\kb\out\*-dbg*.zip
            C:\kb\out\ps_tools_plugin.zip
          compression-level: 0
          if-no-files-found: ignore

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem C:\kb\out -Filter 'krita-x64-*.zip' | Select-Object -First 1
          $final = "C:\kb\out\Krita-PS-5.3.4.1-build${{ github.run_number }}.zip"
          Move-Item $zip.FullName $final
          $tag = "build-${{ github.run_number }}"
          $notes = "Krita 5.3.4.1 + PS tools, build ${{ github.run_number }} (commit ${{ github.sha }}).`n`nPobierz Krita-PS-*.zip, rozpakuj i uruchom bin\krita.exe. Szczegóły w README."
          gh release create $tag $final C:\kb\out\ps_tools_plugin.zip --title "Krita PS build ${{ github.run_number }}" --notes $notes --target ${{ github.sha }}
