# Diagnostics only (no build, no release): runs the probe plugin (.github/probe/gui) in the real Krita window of the
# latest Krita PS release and inside the official Krita, to compare them.
name: Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/probe/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: [ps-plugin, ps, stock]
    steps:
      - uses: actions/checkout@v4
      - name: Get Krita
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force C:\probe | Out-Null
          if ('${{ matrix.flavor }}' -ne 'stock') {
            $tag = gh release list -L 20 --json tagName,isPrerelease -q '[.[] | select(.isPrerelease | not)][0].tagName'
            Write-Host "release: $tag"
            gh release download $tag -p 'Krita-PS-*.zip' -D C:\probe
          } else {
            foreach ($v in '5.3.4', '5.3.3') {
              curl.exe -L --fail --retry 3 -o C:\probe\krita.zip "https://download.kde.org/stable/krita/$v/krita-x64-$v.zip"
              if ($LASTEXITCODE -eq 0) { Write-Host "official Krita $v"; break }
            }
          }
          $zip = Get-ChildItem C:\probe -Filter *.zip | Select-Object -First 1
          7z x $zip.FullName -oC:\probe\k -y | Out-Null
      - name: Run Krita with the probe plugin
        shell: pwsh
        run: |
          $res = Join-Path $env:APPDATA 'krita'
          $py = Join-Path $res 'pykrita'
          New-Item -ItemType Directory -Force $py, (Join-Path $res 'actions') | Out-Null
          Copy-Item -Recurse .github\probe\gui\dup_probe $py
          Copy-Item .github\probe\gui\dup_probe.desktop $py
          $enable = "enable_dup_probe=true"
          if ('${{ matrix.flavor }}' -eq 'ps-plugin') {
            Copy-Item -Recurse plugin\ps_tools $py
            Copy-Item plugin\ps_tools.desktop $py
            Copy-Item plugin\ps_tools.action (Join-Path $res 'actions')
            $enable += "`nenable_ps_tools=true"
          }
          Set-Content (Join-Path $env:LOCALAPPDATA 'kritarc') "[python]`n$enable`n"
          $exe = Get-ChildItem -Recurse C:\probe\k -Filter 'krita.exe' | Select-Object -First 1
          $env:PROBE_OUT = 'C:\probe\gui.json'
          python .github\probe\make_png.py C:\probe\depth16.png
          $env:PROBE_PNG = 'C:\probe\depth16.png'
          $env:PROBE_OPEN = 'png'
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardError C:\probe\krita.err -RedirectStandardOutput C:\probe\krita.out
          if (-not $p.WaitForExit(1500000)) { Write-Host 'Krita did not quit'; $p | Stop-Process -Force }
          Write-Host '--- stderr (last lines)'
          Get-Content C:\probe\krita.err -ErrorAction SilentlyContinue | Select-Object -Last 30
          Write-Host '--- gui.json'
          Get-Content C:\probe\gui.json -ErrorAction SilentlyContinue

